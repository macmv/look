plugins {
  id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
  archivesName = project.archives_base_name
}

repositories {
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  // Mojang mappings on purpose: they match NeoForge, which keeps a later port (or Connector) simple.
  mappings loom.officialMojangMappings()
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
  // Only for networking: the server describes its terrain generator to clients (see WorldDescriptor).
  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

  testImplementation platform('org.junit:junit-bom:5.10.2')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Rust native library ---------------------------------------------------------------------

def osName = System.getProperty('os.name').toLowerCase()
def archName = System.getProperty('os.arch').toLowerCase()

def nativeOs = osName.contains('win') ? 'windows' : osName.contains('mac') ? 'macos' : 'linux'
def nativeArch = (archName == 'aarch64' || archName == 'arm64') ? 'aarch64' : 'x86_64'
def nativeFile = nativeOs == 'windows' ? 'look_native.dll'
    : nativeOs == 'macos' ? 'liblook_native.dylib' : 'liblook_native.so'

def nativeDir = layout.projectDirectory.dir('native')
def nativeOut = layout.buildDirectory.dir('generated/natives')

// Builds the host platform only. The release workflow builds every target on its own runner,
// drops the libraries into build/generated/natives, and passes -PprebuiltNatives to skip this.
def prebuiltNatives = project.hasProperty('prebuiltNatives')

def cargoBuild = tasks.register('cargoBuild', Exec) {
  workingDir = nativeDir.asFile
  commandLine 'cargo', 'build', '--release'
  inputs.dir(nativeDir.dir('src'))
  inputs.file(nativeDir.file('Cargo.toml'))
  inputs.file(nativeDir.file('Cargo.lock'))
  outputs.file(nativeDir.file("target/release/${nativeFile}"))
}

def stageNatives = tasks.register('stageNatives', Copy) {
  dependsOn cargoBuild
  from(nativeDir.file("target/release/${nativeFile}"))
  into(nativeOut.map { it.dir("natives/${nativeOs}-${nativeArch}") })
}

processResources {
  // Only the built jar carries the binaries; the sources jar must not.
  if (!prebuiltNatives) dependsOn stageNatives
  from(nativeOut)

  inputs.property 'version', project.version
  filesMatching('fabric.mod.json') {
    expand 'version': project.version
  }
}

test {
  useJUnitPlatform()
  // The heightfield scene builds a few hundred MB of texture data.
  maxHeapSize = '3g'

  // The render tests need a GL context: `xvfb-run -a ./gradlew test` on a machine without a display.
  // -PupdateGolden rewrites the checked-in images instead of comparing against them.
  systemProperty 'look.goldenDir', layout.projectDirectory.dir('src/test/resources/golden').asFile.path
  systemProperty 'look.renderOut', layout.buildDirectory.dir('render-tests').get().asFile.path
  if (project.hasProperty('updateGolden')) systemProperty 'look.updateGolden', 'true'
  testLogging {
    showStandardStreams = true
    exceptionFormat = 'full'
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 21
  options.encoding = 'UTF-8'
}

java {
  withSourcesJar()
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

loom {
  runs {
    client {
      // Lets us see GL errors from the raycast pass while developing.
      property 'org.lwjgl.util.Debug', 'true'
    }
  }
}
